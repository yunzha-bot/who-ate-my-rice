    ['rice_09',-18.5,-11],['rice_10',-12.6,-6],['rice_11',-17.5,3.6],['rice_12',-18,16],
    ['rice_13',-6,12],['rice_14',-11.25,1]],

  hides: [[-22.9,-7.65],[-22.9,11.4],[-25.15,-9.5],[-9.2,-10.7],[-8.7,17.35],[18.6,-5],[-5.4,-8.6],[17.75,-12.5]],
};

// Same rule as makeDoor(): the door sits at the midpoint of the shared edge.
function doors(map) {
  const out = [];
  for (const [id, aId, bId] of DOOR_PAIRS) {
    const a = map.rooms[aId], b = map.rooms[bId];
    if (a[1] === b[0] || b[1] === a[0]) {
      const x = a[1] === b[0] ? a[1] : b[1];
      const z = (Math.max(a[2], b[2]) + Math.min(a[3], b[3])) / 2;
      out.push([x, z, 'v']);
    } else {
      const z = a[3] === b[2] ? a[3] : b[3];
      const x = (Math.max(a[0], b[0]) + Math.min(a[1], b[1])) / 2;
      out.push([x, z, 'h']);
    }
  }
  return out;
}

function draw(id, map) {
  const cv = document.getElementById(id), ctx = cv.getContext('2d');
  const pad = 26, scale = Math.min((cv.width - pad * 2) / map.width,
    (cv.height - pad * 2) / map.depth);
  const X = x => cv.width / 2 + (x - 0) * scale;
  const Y = z => cv.height / 2 + (z - 0) * scale;
  ctx.clearRect(0, 0, cv.width, cv.height);
  // world box
  ctx.strokeStyle = '#4a4f57'; ctx.lineWidth = 1;
  ctx.strokeRect(X(-map.width / 2), Y(-map.depth / 2), map.width * scale, map.depth * scale);
  // rooms
  for (const [rid, r] of Object.entries(map.rooms)) {
    ctx.fillStyle = r[4] ? '#57503f' : '#43474d';
    ctx.fillRect(X(r[0]), Y(r[2]), (r[1] - r[0]) * scale, (r[3] - r[2]) * scale);
    ctx.strokeStyle = '#7d8288'; ctx.lineWidth = 1;
    ctx.strokeRect(X(r[0]), Y(r[2]), (r[1] - r[0]) * scale, (r[3] - r[2]) * scale);
    const cx = (X(r[0]) + X(r[1])) / 2, cy = (Y(r[2]) + Y(r[3])) / 2;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#d8d3c6'; ctx.font = '600 10px "Microsoft YaHei",sans-serif';
    ctx.fillText(rid, cx, cy - 6);
    ctx.fillStyle = '#b4afa3'; ctx.font = '10px "Microsoft YaHei",sans-serif';
    ctx.fillText(`${r[1] - r[0]}×${r[3] - r[2]}`, cx, cy + 7);
  }
  // furniture
  for (const [, x, z, w, d] of map.furniture) {
    ctx.fillStyle = '#2c2f33';
    ctx.fillRect(X(x - w / 2), Y(z - d / 2), w * scale, d * scale);
  }
  // doors
  for (const [x, z, axis] of doors(map)) {
    ctx.strokeStyle = '#e2903c'; ctx.lineWidth = 3;
    ctx.beginPath();
    if (axis === 'v') { ctx.moveTo(X(x), Y(z - 0.6)); ctx.lineTo(X(x), Y(z + 0.6)); }
    else { ctx.moveTo(X(x - 0.6), Y(z)); ctx.lineTo(X(x + 0.6), Y(z)); }
    ctx.stroke();
  }
  // rice
  ctx.fillStyle = '#f2e5bc';
  for (const [rid, x, z] of map.rice) {
    ctx.beginPath(); ctx.arc(X(x), Y(z), 3.4, 0, 7); ctx.fill();
    ctx.fillStyle = '#e6d9a8'; ctx.font = '9px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(rid.replace('rice_', ''), X(x) + 5, Y(z) - 4);
    ctx.fillStyle = '#f2e5bc';
  }
  // spawns
  for (const [who, x, z] of map.spawns) {
    ctx.fillStyle = who === 'DEEPSEEK' ? '#5aa9e6' : '#e0603f';
    ctx.fillRect(X(x) - 4, Y(z) - 4, 8, 8);
  }
  // hides
  ctx.fillStyle = '#b98ad6';
  for (const [x, z] of map.hides) { ctx.beginPath(); ctx.arc(X(x), Y(z), 4, 0, 7); ctx.fill(); }
}

draw('before', BEFORE);

// ?only=before / ?only=after render a single plan for a standalone screenshot.
const only = new URLSearchParams(location.search).get('only');

    if (!panel.querySelector(`#${only}`)) panel.remove();
  document.querySelector('.legend').style.position = 'static';
