<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>正式菜单镜头裁切探针</title>
<style>body{margin:0;overflow:hidden;background:#d1cec3}canvas{display:block}
output{position:fixed;top:8px;left:8px;background:#fffc;padding:6px;font:12px monospace;white-space:pre}</style>
<!--
  正式菜单镜头裁切探针（仅本目录证据用）：
  - 用正式 buildApartment 建真几何；
  - 相机严格照 ThreeGame.ts 的 FACTION_SELECT 路径：
      positionCameraOnTarget(cam, (0,0,0), (12,14,12))   // ThreeGame.ts:322-323 / 106
      Object.assign(cam, homeFrustum(aspect, true, viewHeight, MAP_DEPTH))  // :553
      fitOrthographicSceneDepth(cam, bounds)
  - 在东翼（含 x=24）四角与中段插醒目标记柱，用来一眼看出有没有被右边缘切掉。
-->
<script type="module">
import * as THREE from 'three';
import { buildApartment } from '/src/three/map/MapBuilder.ts';
import { MAP_DEPTH } from '/src/three/map/apartmentMap.ts';
import { GAME_CONFIG } from '/src/config/gameConfig.ts';
import { homeFrustum } from '/src/three/AlphaPresentation.ts';
import { positionCameraOnTarget } from '/src/three/CameraRelativeMovement.ts';
import { fitOrthographicSceneDepth } from '/src/three/SceneCameraDepth.ts';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xd1cec3);
scene.add(new THREE.HemisphereLight(0xfff5e4, 0x9c9988, 2));
const sun = new THREE.DirectionalLight(0xffefd8, 2.4);
sun.position.set(-8, 24, 12);
scene.add(sun);
const apartment = buildApartment(scene, { debug: false });

// 东翼标记：从 (18,-15) 到 (24,15) 的红色粗线框 + 四个角柱。
const H = 7;
function pillar(x, z, color) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(.4, H, .4),
    new THREE.MeshBasicMaterial({ color }));
  mesh.position.set(x, H / 2, z);
  scene.add(mesh);
}
function edge(a, b, color) {
  const points = [new THREE.Vector3(a[0], H, a[1]), new THREE.Vector3(b[0], H, b[1])];
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({ color })));
}
edge([18, -15], [24, -15], 0xff0000); edge([24, -15], [24, 15], 0xff0000);
edge([24, 15], [18, 15], 0xff0000); edge([18, 15], [18, -15], 0xff0000);
pillar(24, -15, 0xff0000);   // 东翼东北角（最容易被右边缘切掉的一点）
pillar(24, 15, 0xff8800);    // 车库东南角
pillar(18, -15, 0x00aa00);   // 客房西北角
pillar(18, 15, 0x0066ff);    // 东走廊南端
pillar(-24, -15, 0xff00ff);  // 地图西边界（对照）
pillar(-24, 15, 0x00ffff);

const visualBounds = new THREE.Box3().setFromObject(apartment.root);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.append(renderer.domElement);
const camera = new THREE.OrthographicCamera();
const offset = new THREE.Vector3(12, 14, 12);
const status = document.createElement('output');
document.body.append(status);

function draw() {
  const aspect = innerWidth / innerHeight;
  const frustum = homeFrustum(aspect, true,
    GAME_CONFIG.three.viewHeight, MAP_DEPTH);
  Object.assign(camera, frustum);
  camera.near = 0.1; camera.far = 100; camera.updateProjectionMatrix();
  positionCameraOnTarget(camera, new THREE.Vector3(0, 0, 0), offset);
  camera.updateMatrixWorld(true);
  fitOrthographicSceneDepth(camera, visualBounds);
  renderer.render(scene, camera);
  // 与 C 端一致的解析：世界点 -> 视图水平坐标 u = 0.7071*(x - z)。
  const u = (x, z) => .70710678 * (x - z);
  status.textContent =
    `aspect ${aspect.toFixed(4)}  ${innerWidth}x${innerHeight}\n` +
    `height ${frustum.top * 2}  left ${frustum.left.toFixed(2)} right ${frustum.right.toFixed(2)}\n` +
    `east NE (24,-15) u=${u(24, -15).toFixed(2)} ` +
    `${u(24, -15) <= frustum.right ? 'IN' : 'OUT(dx=' + (u(24, -15) - frustum.right).toFixed(2) + ')'}   ` +
    `garage SE (24,15) u=${u(24, 15).toFixed(2)} ${u(24, 15) <= frustum.right ? 'IN' : 'OUT'}   ` +
    `west (-24,-15) u=${u(-24, -15).toFixed(2)} ${u(-24, -15) >= frustum.left ? 'IN' : 'OUT'}`;
}
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); draw(); });
draw();
</script></html>
